<!DOCTYPE html>
<html>
<head>
    <title>Cosmic Pulse 2.0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 760px;
            margin: 40px auto;
            padding: 20px;
            background: #f3f6fb;
            color: #172033;
        }
        .card {
            background: white;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 4px 20px #0001;
        }
        h1 { color: #2448a5; }
        input, button { margin-top: 16px; }
        button {
            display: block;
            padding: 13px 20px;
            background: #2448a5;
            color: white;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        img { max-width: 100%; margin-top: 18px; border-radius: 8px; }
        pre {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            background: #edf1f8;
            padding: 15px;
            border-radius: 8px;
        }
        #status { margin-top: 18px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Cosmic Pulse 2.0</h1>
        <p>Upload an image to detect visible antennas, HVAC units, and people.</p>
        <form id="form">
            <input id="file" type="file" accept="image/png,image/jpeg,image/webp" required>
            <div><img id="preview" alt="Image preview" hidden></div>
            <button type="submit">Detect Assets</button>
        </form>
        <p id="status"></p>
        <h3 id="resultTitle" hidden>Detection Results</h3>
        <pre id="results" hidden></pre>
        <p><small>Visual detections only; energy recommendations require telemetry or simulation data.</small></p>
    </div>
    <script>
        const form = document.getElementById('form');
        const fileInput = document.getElementById('file');
        const preview = document.getElementById('preview');
        const status = document.getElementById('status');
        const results = document.getElementById('results');
        const resultTitle = document.getElementById('resultTitle');

        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.hidden = false;
            }
        });

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const file = fileInput.files[0];
            if (!file) return;

            status.textContent = 'Detecting assets...';
            results.hidden = true;
            resultTitle.hidden = true;

            const data = new FormData();
            data.append('file', file);

            try {
                const response = await fetch('/detect', {
                    method: 'POST',
                    body: data
                });
                const output = await response.json();
                if (!response.ok) {
                    throw new Error(output.detail || 'Detection failed');
                }
                results.textContent = JSON.stringify(output, null, 2);
                results.hidden = false;
                resultTitle.hidden = false;
                status.textContent = 'Detection complete!';
            } catch (error) {
                status.textContent = 'Error: ' + error.message;
            }
        });
    </script>
</body>
</html>
